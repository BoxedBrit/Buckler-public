name: Bug report
description: Report a bug affecting Buckler services or integrations
title: "[Bug]: "
labels:
  - bug
body:
  - type: dropdown
    id: service
    attributes:
      label: Service
      description: Which Buckler service is affected?
      options:
        - Website
        - Dashboard
        - API / Backend
        - Game Mod / Plugin
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: platform_type
    attributes:
      label: Platform / Mod Type
      description: Only fill this in for Game Mod / Plugin issues
      options:
        - Fabric
        - Paper
        - Forge
        - Other
    validations:
      required: false

  - type: input
    id: summary
    attributes:
      label: Short summary
      description: A short description of the issue
      placeholder: Example - Player timeline fails to load after filter applied
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly
      placeholder: Explain what went wrong
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the issue
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Perform action ...
        4. Observe issue ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      placeholder: What actually happened?
    validations:
      required: true

  - type: input
    id: buckler_version
    attributes:
      label: Buckler version
      placeholder: Example - v0.4.2 / commit / build

  - type: input
    id: game_version
    attributes:
      label: Game / Minecraft version
      placeholder: Example - 1.21.10

  - type: input
    id: platform_version
    attributes:
      label: Platform / Loader / Server version
      placeholder: Example - Fabric Loader 0.18.4 / Paper 1.21.4

  - type: input
    id: browser
    attributes:
      label: Browser (if applicable)
      placeholder: Example - Firefox 148 / Chrome 122

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Example - Windows 11 / Ubuntu 24.04

  - type: textarea
    id: logs
    attributes:
      label: Logs, errors, screenshots
      description: Paste logs or attach screenshots. Remove sensitive information first.
      placeholder: Paste logs or describe attachments here

  - type: checkboxes
    id: checks
    attributes:
      label: Final checks
      options:
        - label: I have searched existing issues first
          required: true
        - label: I have removed sensitive/private information
          required: true
