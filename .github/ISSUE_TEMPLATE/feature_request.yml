name: Feature request
description: Suggest an improvement or new feature for Buckler
title: "[Feature]: "
labels: ["feature request"]
body:
  - type: dropdown
    id: service
    attributes:
      label: Service
      description: Which Buckler area is this for?
      options:
        - Website
        - Dashboard
        - API / Backend
        - Game Mod / Plugin
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: platform_type
    attributes:
      label: Platform / Mod Type
      description: Select the platform if this is a Game Mod / Plugin request
      options:
        - Fabric
        - Paper
        - Forge
        - Spigot
        - Velocity
        - Other
    validations:
      required: false
    visibleIf:
      field: service
      equals: Game Mod / Plugin

  - type: input
    id: summary
    attributes:
      label: Feature summary
      placeholder: Example - Add live TPS graph to dashboard
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: Describe the issue or limitation
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      placeholder: Describe what you would like to happen
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: Any other approaches you've considered

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      placeholder: Mockups, examples, screenshots, extra notes
